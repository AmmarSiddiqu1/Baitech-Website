<svg width="1920" height="1200" viewBox="0 0 1920 1200" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Background white base -->
  <rect width="1920" height="1200" fill="#FFFFFF"/>
  
  <!-- Large geometric shapes - base layer -->
  
  <!-- Top left red rectangle -->
  <rect x="0" y="0" width="380" height="280" fill="#FF4438" opacity="0.08"/>
  
  <!-- Top right dark navy area -->
  <polygon points="1400,0 1920,0 1920,400 1600,400" fill="#002B49" opacity="0.06"/>
  
  <!-- Large teal triangle - left side -->
  <polygon points="0,350 420,800 0,800" fill="#1ECAD3" opacity="0.08"/>
  
  <!-- Medium teal triangle - center -->
  <polygon points="600,200 1100,400 800,700" fill="#0099A8" opacity="0.07"/>
  
  <!-- Bottom right large light blue area -->
  <polygon points="1200,800 1920,600 1920,1200 1200,1200" fill="#84DADE" opacity="0.06"/>
  
  <!-- Diagonal stripe elements - thin lines for depth -->
  
  <!-- Light blue diagonal stripes - top area -->
  <line x1="200" y1="0" x2="800" y2="600" stroke="#84DADE" stroke-width="40" opacity="0.05"/>
  <line x1="300" y1="0" x2="900" y2="600" stroke="#84DADE" stroke-width="40" opacity="0.05"/>
  <line x1="400" y1="0" x2="1000" y2="600" stroke="#84DADE" stroke-width="40" opacity="0.05"/>
  
  <!-- Medium blue diagonal stripes - center -->
  <line x1="600" y1="200" x2="1400" y2="800" stroke="#1ECAD3" stroke-width="50" opacity="0.06"/>
  <line x1="700" y1="200" x2="1500" y2="800" stroke="#1ECAD3" stroke-width="50" opacity="0.06"/>
  
  <!-- Darker blue diagonal stripes - right side -->
  <line x1="1200" y1="0" x2="1920" y2="600" stroke="#0099A8" stroke-width="60" opacity="0.07"/>
  <line x1="1300" y1="0" x2="1920" y2="550" stroke="#0099A8" stroke-width="60" opacity="0.07"/>
  
  <!-- Medium sized triangles for accent -->
  
  <!-- Small red triangle - top left accent -->
  <polygon points="100,150 280,150 190,50" fill="#FF4438" opacity="0.09"/>
  
  <!-- Red triangle - bottom center -->
  <polygon points="700,900 900,1050 500,1050" fill="#FF4438" opacity="0.08"/>
  
  <!-- Teal triangle - top center -->
  <polygon points="800,100 1000,200 850,350" fill="#1ECAD3" opacity="0.08"/>
  
  <!-- Light blue triangle - mid right -->
  <polygon points="1400,500 1600,600 1500,750" fill="#84DADE" opacity="0.07"/>
  
  <!-- Dark navy triangle - bottom left -->
  <polygon points="100,1000 300,1100 50,1200" fill="#002B49" opacity="0.07"/>
  
  <!-- Small geometric accents -->
  
  <!-- Small red squares/rectangles scattered -->
  <rect x="450" y="300" width="80" height="80" fill="#FF4438" opacity="0.1" transform="rotate(-15 490 340)"/>
  <rect x="1600" y="350" width="60" height="90" fill="#FF4438" opacity="0.08"/>
  <rect x="250" y="650" width="70" height="70" fill="#FF4438" opacity="0.09"/>
  
  <!-- Small teal triangles -->
  <polygon points="1100,250 1180,280 1140,330" fill="#1ECAD3" opacity="0.09"/>
  <polygon points="400,550 480,580 440,630" fill="#0099A8" opacity="0.08"/>
  <polygon points="1700,800 1780,830 1740,880" fill="#1ECAD3" opacity="0.08"/>
  
  <!-- Bottom layer - large subtle shapes for depth -->
  
  <!-- Large light blue polygon - bottom left -->
  <polygon points="0,700 500,900 200,1200 0,1200" fill="#84DADE" opacity="0.05"/>
  
  <!-- Large medium blue polygon - center bottom -->
  <polygon points="600,850 1100,950 1000,1200 500,1200" fill="#1ECAD3" opacity="0.05"/>
  
  <!-- Diagonal line accents - bottom -->
  <line x1="300" y1="800" x2="800" y2="1200" stroke="#0099A8" stroke-width="45" opacity="0.05"/>
  <line x1="1000" y1="700" x2="1600" y2="1200" stroke="#84DADE" stroke-width="45" opacity="0.05"/>
  
  <!-- Additional small accents for richness -->
  
  <!-- Small dark navy rectangles -->
  <rect x="950" y="450" width="50" height="80" fill="#002B49" opacity="0.07" transform="rotate(20 975 490)"/>
  <rect x="1450" y="900" width="60" height="60" fill="#002B49" opacity="0.06"/>
  
  <!-- Tiny light blue accents -->
  <circle cx="650" cy="150" r="25" fill="#84DADE" opacity="0.08"/>
  <circle cx="1250" cy="1050" r="30" fill="#84DADE" opacity="0.07"/>
  
  <!-- Layered triangular shapes for depth - top right -->
  <polygon points="1500,100 1650,200 1550,300" fill="#0099A8" opacity="0.06"/>
  <polygon points="1520,120 1630,200 1570,280" fill="#1ECAD3" opacity="0.07"/>
  
  <!-- Layered triangular shapes - mid left -->
  <polygon points="150,450 300,550 200,650" fill="#84DADE" opacity="0.06"/>
  <polygon points="170,470 280,550 220,630" fill="#1ECAD3" opacity="0.07"/>
</svg>
